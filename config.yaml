# ============================================================
# 直播切片分析工具配置（自动打轴）
# 所有路径均可使用相对路径（相对项目根目录）或绝对路径
#
# ★ API 推荐（2026-09-02，注意时效）：
#   首选「硅基流动 SiliconFlow」：一个 key 通吃文本/视觉/ASR，OpenAI 兼容、国内直连、价格低
#     base_url: https://api.siliconflow.cn/v1
#     文本: Qwen/Qwen2.5-72B-Instruct（或 deepseek-ai/DeepSeek-V3）
#     视觉: Qwen/Qwen2.5-VL-72B-Instruct
#     ASR:  FunAudioLLM/SenseVoiceSmall
#   备选：文本用 DeepSeek（https://api.deepseek.com/v1，中文强、便宜），
#         ASR 在高级设置里单独配硅基流动。
# ============================================================

server:
  host: 127.0.0.1
  port: 8000

data:
  data_dir: ./data          # 任务产物保存目录

ai:
  base_url: https://api.openai.com/v1   # OpenAI 兼容接口（默认）
  api_key: sk-xxxx                     # 你的 API Key
  vision_model: gpt-4o                 # 视觉模型名（预留，打轴暂未使用）
  llm_model: gpt-4o-mini               # 文本模型名（找内容点/打轴）
  asr_model: whisper-1                 # ASR 模型名（语音转写）
  timeout: 180                          # 单次请求超时（秒）
  concurrency: 4                        # 并发调用上限
  # 高级设置：每个模型能力可单独指定接口地址与密钥（空值 = 继承上面的全局配置）
  endpoints:
    llm: {base_url: "", api_key: ""}
    vision: {base_url: "", api_key: ""}
    asr: {base_url: "", api_key: ""}

asr:
  chunk_seconds: 1200                   # 音频切片长度（秒），长音频会自动分段
  language: ""                          # 云端 ASR 语言代码；留空为自动识别
  engine: local                         # local=本地 faster-whisper（默认）/ api=云端 OpenAI 兼容 ASR
  local_model_path: D:\AdobE\VideoCaptioner\AppData\models\faster-whisper-large-v2
                                        # 本地 whisper 模型路径（复用卡卡字幕助手已下载的模型）
  local_device: cuda                    # cuda / cpu（CUDA 不可用时自动回退 CPU）
  local_compute_type: float16           # CUDA: float16 / int8_float16；CPU: int8 / float32
  local_cpu_threads: 6                  # whisper CPU 线程数（仅 CPU 模式生效；留核给 Web 服务，避免转写时页面卡死）
  subtitle_max_chars: 30                # 字幕每行最大字符数（一句话对应精细的一个轴）

axle:
  window_seconds: 600                   # LLM 找内容点的分窗大小（秒）
  overlap_seconds: 60                   # 相邻窗重叠（秒），避免漏掉跨窗内容点
  target_min_seconds: 30                # 目标最短时长（秒）= 30 秒
  target_max_seconds: 3600              # 目标最长时长（秒）= 1 小时
  hard_max_seconds: 3600                # 硬上限（秒）= 1 小时，超过自动拆分
  merge_gap_seconds: 30                 # 相邻内容点合并间隔（秒）
  max_axles: 100                        # 最多输出轴数
  silence_threshold_db: -35             # 静音检测阈值（dB）
  silence_min_seconds: 0.4              # 静音最短时长（秒）

export:
  accurate: false                       # false=无损快速剪切（关键帧对齐）；true=重编码精切
  concurrency: 1                        # 同时导出切片数量；输出目录固定为 data/tasks/{task_id}/exports
