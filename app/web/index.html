<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直播切片分析 · Live Clip Analyzer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <button id="sidebar-toggle" class="sidebar-toggle" title="切换侧栏">☰</button>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">🎬</div>
        <div>
          <div class="brand-name">直播切片分析</div>
          <div class="brand-sub">Live Clip Analyzer</div>
        </div>
      </div>

      <section class="side-section">
        <div class="section-title">新建分析任务</div>
        <form id="create-form">
          <div class="form-row">
            <label for="video_path">视频路径</label>
            <input type="text" id="video_path" placeholder="D:\videos\live_001.flv" required />
          </div>
          <div class="form-row">
            <label for="danmaku_path">弹幕 XML 路径</label>
            <input type="text" id="danmaku_path" placeholder="D:\videos\live_001.xml" />
          </div>
          <div class="form-row two-col">
            <div>
              <label for="offset_seconds">弹幕偏移（秒）</label>
              <input type="number" id="offset_seconds" value="0" step="0.5" />
            </div>
            <div>
              <label for="output_languages">输出语言</label>
              <select id="output_languages">
                <option value="zh,en">中文 + English</option>
                <option value="zh">中文</option>
                <option value="en">English</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">开始分析</button>
        </form>
      </section>

      <section class="side-section">
        <div class="section-title">任务列表</div>
        <div id="task-list" class="task-list"></div>
      </section>

      <div class="sidebar-footer">
        <span class="version-pill">v0.2.0</span>
        <span>本地运行 · 个人使用</span>
      </div>
    </aside>

    <main class="content">
      <section id="empty-state" class="empty-state">
        <div class="empty-icon">🎬</div>
        <h2>开始分析你的直播录像</h2>
        <p>在左侧填写 FLV 视频与 B站弹幕 XML 路径，创建任务后即可查看详细时间轴和切片候选。</p>
        <div class="empty-tags">
          <span>场景切分</span>
          <span>弹幕热度</span>
          <span>ASR 转写</span>
          <span>画面理解</span>
          <span>切片导出</span>
        </div>
      </section>

      <section class="card hidden" id="report-card">
        <div class="report-head">
          <div>
            <div class="report-kicker">LIVE CLIP ANALYZER · REPORT</div>
            <h2 id="report-title">分析报告</h2>
          </div>
          <div class="actions">
            <button id="btn-refresh" class="ghost">刷新</button>
            <a id="link-video" class="btn ghost" target="_blank">预览视频</a>
            <a id="link-report-zh" class="btn ghost" target="_blank">中文 Markdown</a>
            <a id="link-report-en" class="btn ghost" target="_blank">EN Markdown</a>
            <a id="link-export-json" class="btn ghost" target="_blank">JSON</a>
          </div>
          <div class="actions export-actions">
            <label class="check-label"><input type="checkbox" id="export-accurate" /> 精切模式（重编码）</label>
            <button id="btn-export-all" class="btn btn-primary">批量导出全部候选</button>
          </div>
        </div>
        <div id="report-status" class="report-status"></div>

        <div class="section-block">
          <div class="section-head">
            <h3>详细时间轴</h3>
            <div class="filter-row">
              <select id="rank-filter">
                <option value="">全部推荐</option>
                <option value="high">高推荐</option>
                <option value="medium">中推荐</option>
                <option value="low">低推荐</option>
              </select>
              <label for="score-filter">最低评分</label>
              <input type="number" id="score-filter" value="0" min="0" max="10" step="0.5" />
            </div>
          </div>
          <div id="scenes-container" class="scenes"></div>
        </div>

        <div class="section-block">
          <div class="section-head"><h3>长切片候选</h3></div>
          <div id="long-candidates" class="candidates"></div>
        </div>

        <div class="section-block">
          <div class="section-head"><h3>单句素材候选</h3></div>
          <div id="sentence-candidates" class="candidates"></div>
        </div>

        <div class="section-block">
          <div class="section-head"><h3>导出结果</h3></div>
          <div id="export-results" class="candidates"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h3>复核编辑</h3>
      <input type="hidden" id="edit-id" />
      <input type="hidden" id="edit-type" />
      <div class="form-row two-col">
        <div>
          <label>开始（秒）</label>
          <input type="number" id="edit-start" step="0.5" />
        </div>
        <div>
          <label>结束（秒）</label>
          <input type="number" id="edit-end" step="0.5" />
        </div>
      </div>
      <div class="form-row">
        <label>标题</label>
        <input type="text" id="edit-title" />
      </div>
      <div class="form-row two-col">
        <div>
          <label>评分（0-10）</label>
          <input type="number" id="edit-score" min="0" max="10" step="0.1" />
        </div>
        <div>
          <label>推荐等级</label>
          <select id="edit-rank">
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-save-review">保存</button>
        <button id="btn-cancel-review" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
