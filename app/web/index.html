<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直播切片分析 · Live Clip Analyzer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- 右上角设置 -->
  <button id="btn-settings" class="fab-settings" title="设置">⚙️</button>

  <!-- ═══════════ 第一页：首页 ═══════════ -->
  <div class="home" id="home">
    <div class="home-center" id="home-center">
      <div class="home-logo">🎬</div>
      <h1 class="home-title">直播切片分析</h1>
      <p class="home-sub">输入录播视频，自动打轴——找出所有值得切的内容点与精确时间</p>

      <div class="input-bar">
        <span class="input-icon">🎞️</span>
        <input type="text" id="video_path" placeholder="视频路径，如 D:\videos\live_001.flv" required autocomplete="off" />
        <button type="button" class="btn-browse" data-target="video_path" data-filter="video" title="浏览视频文件">📂</button>
      </div>
      <div class="input-bar">
        <span class="input-icon">💬</span>
        <input type="text" id="danmaku_path" placeholder="弹幕 XML 路径（可选）" autocomplete="off" />
        <input type="number" id="offset_seconds" class="offset-input" title="弹幕偏移（秒）" step="0.5" value="0" />
        <button type="button" class="btn-browse" data-target="danmaku_path" data-filter="xml" title="浏览 XML 文件">📂</button>
      </div>

      <button class="btn-start" id="btn-start">开始打轴</button>
      <div class="home-hint">需要先在本机配置 AI 接口（右上角 ⚙️）</div>
    </div>

    <!-- 左下：任务列表正方格 -->
    <div class="home-tasks" id="home-tasks">
      <div class="home-tasks-title">任务列表</div>
      <div id="task-list" class="task-list"></div>
    </div>
  </div>

  <!-- ═══════════ 第二页：报告窗口（嵌套覆盖） ═══════════ -->
  <div class="window-overlay" id="window-overlay">
    <div class="window" id="report-window">
      <!-- 左侧：规整收纳的第一页内容 -->
      <div class="win-sidebar">
        <div class="win-brand">
          <span class="win-brand-logo">🎬</span>
          <div>
            <div class="win-brand-name">直播切片分析</div>
            <div class="win-brand-sub">Live Clip Analyzer</div>
          </div>
        </div>
        <div class="win-tasks-title">任务列表</div>
        <div id="win-task-list" class="task-list"></div>
        <div class="win-sidebar-foot">
          <button id="btn-back-home" class="ghost">← 返回首页</button>
        </div>
      </div>

      <!-- 右侧：打轴结果 -->
      <div class="win-main" id="win-main">
        <div class="win-empty" id="win-empty">
          <div class="win-empty-icon">🎬</div>
          <p>在左侧任务列表选择「查看」，<br />或回到首页创建新任务</p>
        </div>

        <div class="report hidden" id="report-card">
          <div class="report-head">
            <div>
              <div class="report-kicker">LIVE CLIP ANALYZER · AXLES</div>
              <h2 id="report-title">打轴结果</h2>
            </div>
            <div class="actions">
              <button id="btn-refresh" class="ghost">刷新</button>
              <a id="link-video" class="btn ghost" target="_blank">预览视频</a>
              <a id="link-csv" class="btn ghost" target="_blank">导出 CSV</a>
            </div>
            <div class="actions export-actions">
              <label class="check-label"><input type="checkbox" id="export-accurate" /> 精切模式（重编码）</label>
              <button id="btn-export-all" class="btn btn-primary">批量导出全部</button>
            </div>
          </div>
          <div id="report-status" class="report-status"></div>

          <div class="section-block">
            <div class="section-head">
              <h3>切片轴</h3>
              <div class="filter-row">
                <label for="score-filter">最低评分</label>
                <input type="number" id="score-filter" value="0" min="0" max="10" step="0.5" />
              </div>
            </div>
            <div id="axles-container" class="axles"></div>
          </div>

          <div class="section-block">
            <div class="section-head"><h3>导出结果</h3></div>
            <div id="export-results" class="candidates"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════ 模态框 ═══════════ -->

  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h3>复核打轴</h3>
      <input type="hidden" id="edit-id" />
      <div class="form-row two-col">
        <div>
          <label>开始（秒）</label>
          <input type="number" id="edit-start" step="0.5" />
        </div>
        <div>
          <label>结束（秒）</label>
          <input type="number" id="edit-end" step="0.5" />
        </div>
      </div>
      <div class="form-row">
        <label>标题</label>
        <input type="text" id="edit-title" />
      </div>
      <div class="modal-actions">
        <button id="btn-save-review">保存</button>
        <button id="btn-cancel-review" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <div id="file-modal" class="modal hidden">
    <div class="modal-content file-browser">
      <h3 id="file-modal-title">选择文件</h3>
      <div class="fb-path" id="fb-path">加载中…</div>
      <div class="fb-list" id="fb-list"></div>
      <div class="modal-actions">
        <button id="btn-fb-up" class="ghost">↑ 上一级</button>
        <button id="btn-fb-cancel" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <div id="config-modal" class="modal hidden">
    <div class="modal-content config-modal">
      <h3>⚙️ 设置</h3>

      <div class="cfg-section">AI 接口（必填）</div>
      <div class="form-row">
        <label for="cfg-base-url">接口地址 base_url</label>
        <input type="text" id="cfg-base-url" placeholder="https://api.openai.com/v1" autocomplete="off" />
      </div>
      <div class="form-row">
        <label for="cfg-api-key">API Key</label>
        <input type="password" id="cfg-api-key" placeholder="sk-..." autocomplete="off" />
        <div class="cfg-hint" id="cfg-key-hint"></div>
      </div>
      <div class="form-row two-col">
        <div>
          <label for="cfg-vision-model">视觉模型</label>
          <input type="text" id="cfg-vision-model" placeholder="gpt-4o" autocomplete="off" />
        </div>
        <div>
          <label for="cfg-llm-model">文本模型</label>
          <input type="text" id="cfg-llm-model" placeholder="gpt-4o-mini" autocomplete="off" />
        </div>
      </div>
      <div class="form-row">
        <label for="cfg-asr-model">ASR 转写模型</label>
        <input type="text" id="cfg-asr-model" placeholder="whisper-1" autocomplete="off" />
      </div>

      <div class="cfg-section">打轴参数（可选）</div>
      <div class="form-row two-col">
        <div>
          <label for="cfg-target-min">目标最短（秒）</label>
          <input type="number" id="cfg-target-min" min="10" step="10" />
        </div>
        <div>
          <label for="cfg-target-max">目标最长（秒）</label>
          <input type="number" id="cfg-target-max" min="30" step="30" />
        </div>
      </div>
      <div class="form-row">
        <label class="check-label">
          <input type="checkbox" id="cfg-export-accurate" />
          精切模式（重编码，起点更准；不勾选则无损快速剪切）
        </label>
      </div>

      <div class="cfg-hint">保存后，下一个新建任务即使用新配置（无需重启）。若某项被环境变量 LCA_* 覆盖，环境变量优先于此处配置。</div>

      <div class="modal-actions">
        <button id="btn-save-config">保存</button>
        <button id="btn-cancel-config" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
