<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>直播切片分析工具</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🎬 直播切片分析工具</h1>
    <p class="sub">本地 FLV + B站弹幕 XML → 详细时间轴 + 切片候选</p>
  </header>

  <main>
    <section class="card" id="create-card">
      <h2>新建分析任务</h2>
      <form id="create-form">
        <div class="form-row">
          <label>视频路径（本地绝对路径）</label>
          <input type="text" id="video_path" placeholder="例如 D:\videos\live_001.flv" required />
        </div>
        <div class="form-row">
          <label>弹幕 XML 路径</label>
          <input type="text" id="danmaku_path" placeholder="例如 D:\videos\live_001.xml" />
        </div>
        <div class="form-row two-col">
          <div>
            <label>弹幕时间偏移（秒）</label>
            <input type="number" id="offset_seconds" value="0" step="0.5" />
          </div>
          <div>
            <label>输出语言</label>
            <select id="output_languages">
              <option value="zh,en">中文 + English</option>
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
        <button type="submit">创建任务</button>
      </form>
    </section>

    <section class="card" id="tasks-card">
      <h2>任务列表</h2>
      <div id="task-list" class="task-list"></div>
    </section>

    <section class="card hidden" id="report-card">
      <div class="report-head">
        <h2 id="report-title">分析报告</h2>
        <div class="actions">
          <button id="btn-refresh">刷新</button>
          <a id="link-report-zh" class="btn" target="_blank">导出中文 Markdown</a>
          <a id="link-report-en" class="btn" target="_blank">Export EN Markdown</a>
          <a id="link-export-json" class="btn" target="_blank">导出 JSON</a>
        </div>
      </div>
      <div id="report-status" class="muted"></div>

      <h3>📈 详细时间轴</h3>
      <div class="filter-row">
        <label>筛选推荐：</label>
        <select id="rank-filter">
          <option value="">全部</option>
          <option value="high">高</option>
          <option value="medium">中</option>
          <option value="low">低</option>
        </select>
        <label>最低评分：</label>
        <input type="number" id="score-filter" value="0" min="0" max="10" step="0.5" />
      </div>
      <div id="scenes-container" class="scenes"></div>

      <h3>🎞️ 长切片候选</h3>
      <div id="long-candidates" class="candidates"></div>

      <h3>💬 单句素材候选</h3>
      <div id="sentence-candidates" class="candidates"></div>
    </section>
  </main>

  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h3>复核编辑</h3>
      <input type="hidden" id="edit-id" />
      <input type="hidden" id="edit-type" />
      <div class="form-row two-col">
        <div>
          <label>开始（秒）</label>
          <input type="number" id="edit-start" step="0.5" />
        </div>
        <div>
          <label>结束（秒）</label>
          <input type="number" id="edit-end" step="0.5" />
        </div>
      </div>
      <div class="form-row">
        <label>标题</label>
        <input type="text" id="edit-title" />
      </div>
      <div class="form-row two-col">
        <div>
          <label>评分（0-10）</label>
          <input type="number" id="edit-score" min="0" max="10" step="0.1" />
        </div>
        <div>
          <label>推荐等级</label>
          <select id="edit-rank">
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-save-review">保存</button>
        <button id="btn-cancel-review" class="ghost">取消</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
